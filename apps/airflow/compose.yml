# Sentinel-2 land-cover classification · Airflow slice (phase 2)
#
# Included by the root docker-compose.yml. Paths are relative to this file.
#
#   airflow-*  --->  postgres (airflow database: metadata; training database: samples, areas)
#   airflow-*  --->  mlflow   (logs runs, registers the model, resolves models:/<name>@<alias>)
#   airflow-*  --->  minio    (reads the bands, writes the predicted GeoTIFF)
#
# Every value is written in this file and must match the root
# docker-compose.yml where both define it (databases, MinIO, MLflow, model).

x-airflow-common: &airflow-common
  image: aristotekean/sentinel2-airflow:0.1.0
  build:
    context: ../..
    dockerfile: apps/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: change-me-jwt-secret
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Training database (PostGIS) read and written by the DAGs.
    TRAIN_DB_HOST: postgres
    TRAIN_DB_PORT: "5432"
    TRAIN_DB_NAME: training
    TRAIN_DB_USER: training
    TRAIN_DB_PASSWORD: training
    # MLflow tracking server (artifacts proxied by the server) and MinIO data bucket.
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_EXPERIMENT_NAME: sentinel2-land-cover
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    DATA_BUCKET: sentinel2
    MODEL_NAME: sentinel2-land-cover
    MODEL_ALIAS: production
    BAND_NAMES: B01,B02,B03,B04,B05,B06,B07,B8A,B11,B12
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    # Local copy of the scene (git-ignored), read by the upload_bands DAG.
    - ../../data:/opt/airflow/data:ro
  # On Linux bind mounts keep the host's ownership, so the Airflow user must be
  # the host user (replace 50000 below and in airflow-init with `id -u`) to write logs. Docker
  # Desktop/OrbStack on macOS map ownership, so 50000 works.
  user: "50000:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    train-db-migrate:
      condition: service_completed_successfully
    mlflow:
      condition: service_healthy

services:
  # One-shot: migrates the airflow database and creates the admin user.
  airflow-init:
    <<: *airflow-common
    container_name: sentinel2-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "50000:0" /opt/airflow/{logs,dags,plugins,config}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"

  # LocalExecutor: api-server + scheduler + dag-processor + triggerer.
  airflow-apiserver:
    <<: *airflow-common
    container_name: sentinel2-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: sentinel2-airflow-scheduler
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: sentinel2-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: sentinel2-airflow-triggerer
    command: triggerer
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
